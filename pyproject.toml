[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ei"
version = "0.1.0"
description = "Eigenmode instrumentation for persistent-structure interpretability in neural systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
models = ["torch>=2.1", "transformer-lens>=2.0", "transformers>=4.40"]
dist = ["ray[default]>=2.9"]

[project.scripts]
ei = "ei.cli:main"
ei-validate = "ei.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
